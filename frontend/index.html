<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gene Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .alignment-viewer {
        font-family: 'Courier New', monospace;
        background: #1a1a2e;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      .sequence-line {
        margin-bottom: 0.5rem;
        white-space: nowrap;
      }
      .sequence {
        display: inline-block;
        letter-spacing: 1px;
      }
      .label {
        color: #888;
        margin-right: 0.5rem;
        width: 50px;
        display: inline-block;
      }
      .ref { color: #4fc3f7; }
      .query { color: #81c784; }
      .match { color: #fff; }
      .match-pipe { color: #ffd54f; }
      .mismatch { color: #ef5350; }
      .gene-card {
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
      }
      .gene-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      }
      .category-badge {
        font-size: 0.75rem;
      }
      .stats-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .upload-zone {
        border: 2px dashed #ccc;
        border-radius: 10px;
        padding: 2rem;
        text-align: center;
        transition: all 0.3s;
      }
      .upload-zone:hover {
        border-color: #667eea;
        background: #f8f9ff;
      }
      .upload-zone.dragover {
        border-color: #667eea;
        background: #e8eaff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
