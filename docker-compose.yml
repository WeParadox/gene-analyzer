version: '3.8'

services:
  backend:
    build: ./backend
    container_name: gene-analyzer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./gene_analyzer.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gene-analyzer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
